services:
  kafka:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://127.0.0.1:${SPINE_DEMO_KAFKA_PORT:-19092}
    ports:
      - "${SPINE_DEMO_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "-X", "brokers=localhost:9092", "--exit-when-healthy"]
      interval: 2s
      timeout: 2s
      retries: 30
