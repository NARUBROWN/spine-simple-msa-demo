name: Verify order and stock example

on:
  push:
    branches: [preview, rc, main]
  pull_request:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Example Verification / ${{ github.base_ref || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            go.sum
            order-app/go.sum
            stock-app/go.sum
      - name: Check dependency channel
        id: channel
        env:
          TARGET_CHANNEL: ${{ github.base_ref || github.ref_name }}
        run: python3 scripts/release/example_channels.py --channel "$TARGET_CHANNEL" --github-output "$GITHUB_OUTPUT"
      - name: Install pinned Spine CLI
        env:
          CLI_VERSION: ${{ steps.channel.outputs.cli_version }}
        run: go install "github.com/NARUBROWN/spine-cli/cmd/spine@$CLI_VERSION"
      - run: |
          go mod download all
          go -C order-app mod download all
          go -C stock-app mod download all
      - run: ./scripts/check.sh
      - run: GOWORK=off spine contract probe --root ./order-app --json
      - run: GOWORK=off spine contract probe --root ./stock-app --json
      - run: ./scripts/e2e.sh
